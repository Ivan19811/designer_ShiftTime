services:
  - type: web
    name: designer_ShiftTime
    env: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm start
    autoDeploy: true
    plan: free
    envVars:
      - key: SHEETS_WEBAPP_URL
        sync: false     # значення задаси у Dashboard → Environment
      - key: NETLIFY_AUTH_TOKEN
        sync: false
      - key: NETLIFY_API_BASE_URL
        value: https://api.netlify.com/api/v1
      - key: PUBLIC_API_BASE_URL
        value: https://designer-shifttime.onrender.com
      - key: CORS_ORIGIN
        value: ""
      - key: CORS_ALLOWLIST
        value: https://designer-shifttime.netlify.app,http://localhost:8888,http://localhost:3000