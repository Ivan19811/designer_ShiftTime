<!doctype html>
<html lang="uk">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Command Test Widget</title>
  <style>
    html,body{margin:0;padding:0;background:#020617;color:#e2e8f0;font:14px/1.45 Inter,system-ui,sans-serif}

<body>
  <div class="page">
    <div class="title">AI Command Test Widget</div>

  <script type="module">
    import { initAiCommandTestWidget } from '../../js/design/ai-command/index.js';
    initAiCommandTestWidget('#app', {

    });
